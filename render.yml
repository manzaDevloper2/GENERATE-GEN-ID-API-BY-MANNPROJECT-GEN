services:
  - type: web
    name: manza-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 8 --timeout 120 --keep-alive 5 --log-level info --access-logfile - --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TZ
        value: "Asia/Jakarta"
      - key: CLEANUP_INTERVAL
        value: "3600"
      - key: MAX_STORAGE_MB
        value: "400"
      - key: MAX_AGE_DAYS
        value: "3"
    healthCheckPath: /health
    autoDeploy: true